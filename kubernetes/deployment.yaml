apiVersion: apps/v1
kind: Deployment
metadata:
  name: three-tier-app-deployment
  labels:
    app: three-tier-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: three-tier-app
  template:
    metadata:
      labels:
        app: three-tier-app
    spec:
      containers:
      - name: three-tier-app
        image: yashdolare2230/three-tier-app:v1 
        ports:
        - containerPort: 3000
        envFrom:
          - secretRef:
              name: rds-credentials
        env:
          - name: PORT
            value: "3000"
